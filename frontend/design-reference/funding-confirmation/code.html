<style>
        /* Grain Overlay for Tactile Feel */
        .paper-grain::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0.03;
            z-index: 50;
        }
        /* Strict ledger hairlines */
        .ledger-line {
            border-bottom: 1px solid theme('colors.outline-variant');
        }
        .ledger-line-top {
            border-top: 1px solid theme('colors.outline-variant');
        }

<body class="bg-background text-on-surface font-body-md text-body-md antialiased paper-grain flex items-center justify-center min-h-screen relative overflow-hidden">
<!-- Dimmed Background Overlay -->
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-[2px] z-0"></div>
<!-- Modal Container -->
<main class="relative z-10 w-full max-w-md mx-margin-mobile md:mx-auto bg-[#FBFAF6] border border-outline rounded-[6px] p-8 flex flex-col gap-8">
<!-- Header -->
<header class="flex flex-col gap-2"><span class="font-kicker-label text-kicker-label text-on-surface-variant uppercase tracking-widest mb-1">04 / FUNDING CONFIRMATION</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight text-[48px]">Confirm Contribution</h1>
<p class="text-on-surface-variant font-body-md text-body-md">Review transaction details before signing.</p>
</header>
<!-- Ledger Summary Block -->
<section class="flex flex-col border border-outline rounded-none">
<!-- Project Row -->
<div class="flex flex-col p-4 ledger-line bg-surface-container-low">
<span class="font-kicker-label text-kicker-label text-on-surface-variant uppercase mb-2">Project</span>
<span class="font-data-mono text-data-mono text-on-surface font-semibold tracking-wide">Decentralized Compute Cluster Alpha</span>
</div>
<!-- Amount Row -->
<div class="flex flex-col p-4 ledger-line bg-[#FBFAF6]">
<span class="font-kicker-label text-kicker-label text-on-surface-variant uppercase mb-2">Amount</span>
<div class="flex items-baseline justify-between">
<span class="font-data-mono text-[24px] leading-none text-primary tracking-wider">0.5 <span class="text-on-surface-variant text-[16px]">ETH</span></span>
<span class="font-data-mono text-data-mono text-on-surface-variant">~$1,150.00 USD</span>
</div>
</div>
<!-- Gas Row -->
<div class="flex flex-col p-4 ledger-line bg-[#FBFAF6]">
<div class="flex items-center justify-between">
<span class="font-kicker-label text-kicker-label text-on-surface-variant uppercase">Estimated Gas</span>
<span class="font-data-mono text-data-mono text-on-surface-variant">0.0012 ETH</span>
</div>
</div>
<!-- Total Row -->
<div class="flex flex-col p-4 bg-surface-container-high">
<span class="font-kicker-label text-kicker-label text-on-surface-variant uppercase mb-2">Total Deduction</span>
<span class="font-data-mono text-[24px] leading-none text-on-surface font-bold tracking-wider inline-block border-b border-outline pb-1 border-on-surface">0.5012 ETH</span>
</div>
</section>
<!-- Action Buttons -->
<footer class="flex flex-col gap-3 mt-2">
<button class="w-full bg-primary-container text-on-primary font-body-md text-body-md py-4 font-medium border border-primary hover:bg-surface-tint transition-colors duration-200 flex items-center justify-center gap-2 group rounded-[6px]">
<span class="font-data-mono text-[12px] border border-on-primary px-2 py-0.5 rounded-full">SECURE</span>
                Confirm and fund
            </button>
<button class="w-full bg-transparent text-on-surface-variant font-body-md text-body-md py-4 font-medium border border-outline hover:bg-surface-container-low hover:text-on-surface transition-colors duration-200 rounded-[6px]">

</footer>
